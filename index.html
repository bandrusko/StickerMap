<script>

require([
    "esri/Map",
    "esri/WebMap",
    "esri/views/MapView",
    "esri/widgets/Locate",
    "esri/widgets/BasemapGallery",
    "esri/widgets/Expand",
    "esri/widgets/Search",
    "esri/widgets/Legend"
], (
    Map,
    WebMap,
    MapView,
    Locate,
    BasemapGallery,
    Expand,
    Search,
    Legend
) => {

    console.log("ArcGIS API Loaded");

    // LOAD WEBMAP

    const webmap = new WebMap({
        portalItem: {
            id: "b56264b4094d40cd812b7c843fe9b21c"
        }
    });

    // CREATE MAP VIEW

    const view = new MapView({
        container: "viewDiv",
        map: webmap,

        center: [-98.35, 39.5],
        zoom: 4
    });

    // DEBUGGING

    view.when(() => {

        console.log("Map loaded successfully");

        // LIST LAYERS

        webmap.layers.forEach(layer => {

            console.log("Layer Loaded:", layer.title);

            // ENABLE POPUPS

            layer.popupEnabled = true;

            // SAFE POPUP TEMPLATE

            layer.popupTemplate = {

                title: "{Name}",

                content: [

                    {
                        type: "text",

                        text:
                            "<b>Description:</b> {Description}<br><br>" +
                            "<b>Submitted By:</b> {Creator}"
                    },

                    {
                        type: "attachments"
                    }

                ]

            };

        });

    }).catch((error) => {

        console.error("MAP FAILED TO LOAD:", error);

    });

    // LOCATE BUTTON

    const locateBtn = new Locate({
        view: view
    });

    view.ui.add(locateBtn, "top-left");

    // BASEMAP GALLERY

    const basemapGallery = new BasemapGallery({
        view: view
    });

    const bgExpand = new Expand({
        view: view,
        content: basemapGallery,
        expandIcon: "basemap",
        expandTooltip: "Change basemap"
    });

    view.ui.add(bgExpand, "bottom-right");

    // SEARCH

    const searchWidget = new Search({
        view: view,
        container: "searchDiv"
    });

    // LEGEND

    const legend = new Legend({
        view: view
    });

    const legendExpand = new Expand({
        view: view,
        content: legend,
        expanded: false
    });

    view.ui.add(legendExpand, "bottom-left");

    // COORDINATES

    const coordsDiv = document.getElementById("coords");

    view.on("pointer-move", function (evt) {

        const point = view.toMap({
            x: evt.x,
            y: evt.y
        });

        if (point) {

            coordsDiv.innerHTML =
                `Lon: ${point.longitude.toFixed(4)} | ` +
                `Lat: ${point.latitude.toFixed(4)}`;

        }

    });

});

// DISCLAIMER CLOSE BUTTON

document.addEventListener("DOMContentLoaded", () => {

    const modal =
        document.getElementById("disclaimerModal");

    document
        .getElementById("closeDisclaimer")
        .addEventListener("click", () => {

            modal.style.display = "none";

        });

});

</script>
